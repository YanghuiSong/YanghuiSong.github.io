    <text x="495" y="112" fill="#8dd7bb" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">OFFLINE PROMPT POOL</text>
    <g font-family="Arial, sans-serif" font-size="16">
      <rect x="495" y="137" width="94" height="38" rx="19" fill="#eef6f1"/><text x="522" y="162" fill="#214b3b">airplane</text>
      <rect x="599" y="137" width="84" height="38" rx="19" fill="#eef6f1"/><text x="627" y="162" fill="#214b3b">bridge</text>
