<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Prompt-calibrated remote sensing segmentation</title>
  <desc id="desc">A stylized remote sensing image passes through prompt calibration and produces a semantic mask.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f0eb"/><stop offset="1" stop-color="#cadbd2"/></linearGradient>
    <linearGradient id="sat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c8d5b4"/><stop offset="1" stop-color="#6f9885"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#173a2c" flood-opacity=".16"/></filter>
  </defs>
  <rect width="900" height="700" fill="url(#bg)"/>
  <circle cx="770" cy="92" r="170" fill="none" stroke="#2a725b" opacity=".12" stroke-width="2"/>
  <circle cx="770" cy="92" r="115" fill="none" stroke="#2a725b" opacity=".12" stroke-width="2"/>
  <g filter="url(#s)">
