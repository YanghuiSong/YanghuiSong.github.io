    <text x="92" y="443" fill="#17382d" font-family="Arial, sans-serif" font-size="22" font-weight="700">Remote sensing image</text>
    <text x="92" y="475" fill="#748179" font-family="Arial, sans-serif" font-size="15">Dense objects · scale variation</text>
  </g>

